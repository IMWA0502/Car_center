<div class="filter-box">
    <h1>Filter</h1>
    <div>
        <p>Make</p>
        <select id="make" [(ngModel)]="selectedmake" class="model-select" (change)="onFilterChange()">
            <option *ngFor="let make of makes" [value]="make">{{ make }}</option>
        </select>
    </div>

    <div>
        <p>Model</p>
        <select id="model" [(ngModel)]="selectedmodel" class="model-select" (change)="onFilterChange()">
            <option value="All">All Models</option>
            <option *ngFor="let model of models" [value]="model">{{ model }}</option>
        </select>
    </div>

    <div>
        <h2>Body Type</h2>
        <div *ngFor="let type of bodyTypes">
            <label>
                <input type="checkbox" [(ngModel)]="type.selected" (change)="onFilterChange()" />
                {{ type.name }} <span style="color: #888;">({{ type.count }})</span>
            </label>
        </div>
    </div>
    
    <div>
        <h2>Price Range</h2>
        <div class="range-container">
            <input type="range" 
                   [min]="priceMin" 
                   [max]="priceMax" 
                   [(ngModel)]="currentPriceMin" 
                   class="range-slider range-min" 
                   (input)="onPriceRangeChange()" />
            <input type="range" 
                   [min]="priceMin" 
                   [max]="priceMax" 
                   [(ngModel)]="currentPriceMax" 
                   class="range-slider range-max" 
                   (input)="onPriceRangeChange()" />
        </div>
        <div class="range-values">£{{ currentPriceMin | number:'1.0-0' }} - £{{ currentPriceMax | number:'1.0-0' }}</div>
    </div>

    <div>
        <h2>Year Range</h2>
        <div class="range-container">
            <input type="range" 
                   [min]="yearMin" 
                   [max]="yearMax" 
                   [(ngModel)]="currentYearMin" 
                   class="range-slider range-min" 
                   (input)="onYearRangeChange()" />
            <input type="range" 
                   [min]="yearMin" 
                   [max]="yearMax" 
                   [(ngModel)]="currentYearMax" 
                   class="range-slider range-max" 
                   (input)="onYearRangeChange()" />
        </div>
        <div class="range-values">{{ currentYearMin }} - {{ currentYearMax }}</div>
    </div>

    <div>
        <h2>Mileage Range</h2>
        <div class="range-container">
            <input type="range" 
                   [min]="mileageMin" 
                   [max]="mileageMax" 
                   [(ngModel)]="currentMileageMin" 
                   class="range-slider range-min" 
                   (input)="onMileageRangeChange()" />
            <input type="range" 
                   [min]="mileageMin" 
                   [max]="mileageMax" 
                   [(ngModel)]="currentMileageMax" 
                   class="range-slider range-max" 
                   (input)="onMileageRangeChange()" />
        </div>
        <div class="range-values">{{ currentMileageMin | number }} - {{ currentMileageMax | number }} km</div>
    </div>
    
    <div>
        <h2>Engine Type</h2>
        <div *ngFor="let engine of engineTypes">
            <label>
                <input type="checkbox" [(ngModel)]="engine.selected" (change)="onFilterChange()" />
                {{ engine.name }} <span style="color: #888;">({{ engine.count }})</span>
            </label>
        </div>
    </div>

    <div>
        <h2>Drivetrain</h2>
        <div *ngFor="let drive of drivetrains">
            <label>
                <input type="checkbox" [(ngModel)]="drive.selected" (change)="onFilterChange()" />
                {{ drive.name }} <span style="color: #888;">({{ drive.count }})</span>
            </label>
        </div>
    </div>
    
    <button type="button" (click)="clearFilters()" style="margin-top: 20px; padding: 10px; background: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Clear All Filters
    </button>
</div>
